<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0F1A19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rhythm</title>
<style>
  :root{
    --bg:#0F1A19; --panel:#152B29; --panel2:#0C1615;
    --ink:#ECE7DA; --muted:#7A928D;
    --brass:#C79A3D; --coral:#E86A5B;
    --line:rgba(236,231,218,0.10); --line2:rgba(236,231,218,0.22);
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(1200px 500px at 50% -10%, #1a3230 0%, transparent 60%),
      var(--bg);
    color:var(--ink); font-family:var(--sans);
    padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 14px);
    max-width:560px; margin:0 auto;
    -webkit-font-smoothing:antialiased;
  }
  header{display:flex;align-items:baseline;justify-content:space-between;padding:14px 2px 6px}
  .brand{font-weight:700;letter-spacing:.34em;font-size:13px;text-transform:uppercase;color:var(--ink)}
  .sig{font-family:var(--mono);color:var(--brass);font-size:14px;letter-spacing:.05em}

  /* transport */
  .transport{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .bpm{display:flex;flex-direction:column;line-height:.9;flex:1}
  .bpm .num{font-family:var(--mono);font-size:56px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--ink)}
  .bpm .lbl{font-size:11px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;margin-top:4px}
  .beacon{width:14px;height:14px;border-radius:50%;background:#26403c;margin-left:4px;transition:none}
  .beacon.on{background:var(--brass);box-shadow:0 0 16px 3px rgba(199,154,61,.7)}
  .beacon.on.acc{background:var(--coral);box-shadow:0 0 20px 4px rgba(232,106,91,.8)}
  .play{width:74px;height:74px;border-radius:50%;border:1px solid var(--line2);
    background:var(--coral);color:#160b09;display:grid;place-items:center;cursor:pointer;flex:none;
    box-shadow:0 6px 22px rgba(232,106,91,.28)}
  .play:active{transform:scale(.96)}
  .play svg{width:30px;height:30px}

  /* grid */
  .stage{margin:14px 0}
  .rowlabel{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;padding:0 4px 6px}
  .bar{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:12px;
    height:78px;margin-bottom:8px;overflow:hidden;display:flex;align-items:stretch}
  .bar.variation{border-color:rgba(232,106,91,.45)}
  .bar.active{border-color:var(--line2);box-shadow:0 0 0 1px var(--line2) inset}
  .grid-line{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
  .grid-line.down{background:var(--line2)}
  .playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--brass);
    box-shadow:0 0 12px 1px rgba(199,154,61,.8);left:0;display:none}
  .bar.active .playhead{display:block}
  .note{position:relative;display:grid;place-items:center;z-index:2}
  .note svg{width:100%;height:100%;overflow:visible}
  .nh{transition:transform .04s}
  .note.hit .nh{transform:translateY(-3px) scale(1.14)}
  .ruler{display:flex;padding:2px 0 0}
  .ruler span{flex:1;text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted)}

  /* controls */
  .panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:16px;padding:14px 16px;margin-top:6px}
  .ctl{margin:6px 0 14px}
  .ctl:last-child{margin-bottom:0}
  .ctl > .k{font-size:11px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:9px;display:block}
  input[type=range]{width:100%;-webkit-appearance:none;height:4px;border-radius:3px;background:#294744;margin:2px 0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
    background:var(--ink);border:4px solid var(--panel);box-shadow:0 2px 6px rgba(0,0,0,.4);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border:4px solid var(--panel);border-radius:50%;background:var(--ink)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{flex:1;min-width:56px;text-align:center;padding:11px 6px;border-radius:10px;border:1px solid var(--line);
    background:transparent;color:var(--muted);font-family:var(--sans);font-size:14px;cursor:pointer;font-weight:600}
  .chip.sel{background:var(--brass);color:#160b09;border-color:var(--brass)}
  .toggles{display:flex;gap:8px}
  .tg{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;
    border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font-size:13px;cursor:pointer;font-weight:600}
  .tg .dot{width:34px;height:20px;border-radius:12px;background:#294744;position:relative;flex:none}
  .tg .dot::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:.15s}
  .tg.on{border-color:var(--brass)}
  .tg.on .dot{background:var(--brass)}
  .tg.on .dot::after{left:16px;background:#160b09}
  .row2{display:flex;gap:10px;margin-top:10px}
  .btn{flex:1;padding:14px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);
    color:var(--ink);font-size:14px;font-weight:700;letter-spacing:.04em;cursor:pointer}
  .btn:active{transform:scale(.98)}
  .btn.tap{font-family:var(--mono)}
  .hint{color:var(--muted);font-size:11px;text-align:center;margin:16px 0 2px;letter-spacing:.03em}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <header>
    <div class="brand">Rhythm</div>
    <div class="sig" id="sig">4/4</div>
  </header>

  <div class="transport">
    <div class="bpm">
      <span class="num" id="bpmNum">90</span>
      <span class="lbl">BPM</span>
    </div>
    <div class="beacon" id="beacon"></div>
    <button class="play" id="playBtn" aria-label="Play">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l12 7-12 7z"/></svg>
    </button>
  </div>

  <div class="stage">
    <div class="rowlabel"><span>4-bar phrase</span><span style="color:var(--coral)">bar 4 · variation</span></div>
    <div id="bars"></div>
    <div class="ruler" id="ruler"></div>
  </div>

  <div class="panel">
    <div class="ctl">
      <span class="k">Tempo · <span id="bpmLabel">90</span></span>
      <input type="range" id="bpm" min="40" max="220" value="90">
    </div>
    <div class="ctl">
      <span class="k">Time signature</span>
      <div class="chips" id="sigChips">
        <button class="chip sel" data-sig="4/4">4/4</button>
        <button class="chip" data-sig="3/4">3/4</button>
        <button class="chip" data-sig="6/8">6/8</button>
      </div>
    </div>
    <div class="ctl">
      <span class="k">Complexity</span>
      <div class="chips" id="cxChips">
        <button class="chip" data-cx="1">Simple</button>
        <button class="chip sel" data-cx="2">Medium</button>
        <button class="chip" data-cx="3">Hard</button>
      </div>
    </div>
    <div class="ctl" style="margin-bottom:0">
      <span class="k">Sound</span>
      <div class="toggles">
        <button class="tg on" id="tgMet"><span>Metronome</span><span class="dot"></span></button>
        <button class="tg on" id="tgNotes"><span>Notes</span><span class="dot"></span></button>
        <button class="tg" id="tgHap"><span>Haptics</span><span class="dot"></span></button>
      </div>
      <div class="row2">
        <button class="btn tap" id="tapBtn">TAP TEMPO</button>
        <button class="btn" id="genBtn" style="background:var(--coral);color:#160b09;border-color:var(--coral)">NEW RHYTHM</button>
      </div>
      <div class="toggles" style="margin-top:10px">
        <button class="tg" id="tgCount" style="flex:1"><span>Count-in bar</span><span class="dot"></span></button>
      </div>
    </div>
  </div>

  <div class="hint">Bars 1–3 repeat · bar 4 varies. Add to Home Screen to run like an app.</div>

<script>
"use strict";
(() => {
  // ---------- state ----------
  const S = {
    bpm: 90, sig: "4/4", beats: 4, complexity: 2,
    met: true, notes: true, hap: false, countIn: false,
    rows: [], playing: false,
  };

  // ---------- notation generator ----------
  // A "note" = {t: startBeat, d: durBeat, rest: bool}
  function cellPool(cx){
    // duration-1 beat cells; each returns an array of notes relative to beat start
    const Q  = [{t:0,d:1}];
    const QR = [{t:0,d:1,rest:true}];
    const EE = [{t:0,d:.5},{t:.5,d:.5}];
    const ER = [{t:0,d:.5},{t:.5,d:.5,rest:true}];
    const T3 = [{t:0,d:1/3},{t:1/3,d:1/3},{t:2/3,d:1/3}];
    const S16= [{t:0,d:.25},{t:.25,d:.25},{t:.5,d:.25},{t:.75,d:.25}];
    const DOT= [{t:0,d:.75},{t:.75,d:.25}];             // dotted-8th + 16th
    const p = [];
    const add=(w,len,notes)=>p.push({w,len,notes});
    // len-1 cells
    add(6,1,Q); add(3,1,QR);
    if(cx>=2){ add(6,1,EE); add(2,1,ER); }
    if(cx>=3){ add(3,1,T3); add(3,1,S16); add(3,1,DOT); }
    // multi-beat sustains
    add(2,2,[{t:0,d:2}]);                                // half
    if(cx<=2) add(1,2,[{t:0,d:2,rest:true}]);            // half rest
    add(1,4,[{t:0,d:4}]);                                // whole (only fits full 4/4-ish)
    return p;
  }
  function pick(pool){
    const tot=pool.reduce((a,c)=>a+c.w,0); let r=Math.random()*tot;
    for(const c of pool){ if((r-=c.w)<=0) return c; } return pool[0];
  }
  function makeBar(beats, cx){
    const pool = cellPool(cx);
    for(let tries=0; tries<40; tries++){
      const out=[]; let pos=0, ok=true;
      while(pos<beats){
        const rem=beats-pos;
        const opts=pool.filter(c=>c.len<=rem);
        if(!opts.length){ok=false;break;}
        const c=pick(opts);
        c.notes.forEach(n=>out.push({t:pos+n.t,d:n.d,rest:!!n.rest}));
        pos+=c.len;
      }
      if(ok && out.some(n=>!n.rest)) return out;
    }
    return Array.from({length:beats},(_,i)=>({t:i,d:1,rest:false}));
  }
  function barsEqual(a,b){
    if(a.length!==b.length) return false;
    return a.every((n,i)=>n.t===b[i].t && n.d===b[i].d && n.rest===b[i].rest);
  }
  function regen(){
    const A=makeBar(S.beats,S.complexity);
    let B=makeBar(S.beats,S.complexity), guard=0;
    while(barsEqual(A,B) && guard++<20){ B=makeBar(S.beats,S.complexity); } // ensure B differs from A
    S.rows=[A,A,A,B];
    render();
  }

  // ---------- SVG glyph ----------
  function glyph(d, rest, coral){
    const col = coral ? "#E86A5B" : "#ECE7DA";
    const stem = coral ? "#E86A5B" : "#ECE7DA";
    if(rest){
      const m = 'rgba(122,146,141,.9)';
      if(d>=4) return `<rect x="14" y="26" width="16" height="6" fill="${m}"/><line x1="8" y1="26" x2="36" y2="26" stroke="${m}" stroke-width="1.5"/>`;
      if(d>=2) return `<rect x="14" y="30" width="16" height="6" fill="${m}"/><line x1="8" y1="36" x2="36" y2="36" stroke="${m}" stroke-width="1.5"/>`;
      if(d>=1) return `<path d="M20 20 l6 8 l-5 6 l6 8 q-8 -5 -3 -10 l-6 -8 z" fill="${m}"/>`;
      // eighth-ish rest
      return `<circle cx="18" cy="26" r="3" fill="${m}"/><path d="M20 24 q6 6 4 20" stroke="${m}" stroke-width="2" fill="none"/>`;
    }
    // note: open head for whole/half, filled otherwise; stem up; flags for 8th/16th; dot for .75
    const open = d>=2;
    const cx=20, cy=44, rx=8.5, ry=6.2;
    let head = open
      ? `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" transform="rotate(-20 ${cx} ${cy})" fill="none" stroke="${col}" stroke-width="2.4"/>`
      : `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" transform="rotate(-20 ${cx} ${cy})" fill="${col}"/>`;
    let stemEl = (d>=4) ? "" : `<line x1="${cx+rx-1}" y1="${cy-2}" x2="${cx+rx-1}" y2="12" stroke="${stem}" stroke-width="2.2"/>`;
    let flags="";
    const fx=cx+rx-1;
    if(Math.abs(d-0.5)<1e-6 || Math.abs(d-1/3)<1e-6){
      flags=`<path d="M${fx} 12 q11 4 8 16" stroke="${stem}" stroke-width="2.2" fill="none"/>`;
    } else if(Math.abs(d-0.25)<1e-6){
      flags=`<path d="M${fx} 12 q11 4 8 15" stroke="${stem}" stroke-width="2.2" fill="none"/>
             <path d="M${fx} 19 q11 4 8 15" stroke="${stem}" stroke-width="2.2" fill="none"/>`;
    } else if(Math.abs(d-0.75)<1e-6){
      flags=`<path d="M${fx} 12 q11 4 8 16" stroke="${stem}" stroke-width="2.2" fill="none"/>`;
    }
    let dot = (Math.abs(d-0.75)<1e-6) ? `<circle cx="${cx+rx+6}" cy="${cy}" r="2.1" fill="${col}"/>` : "";
    return head+stemEl+flags+dot;
  }

  // ---------- render ----------
  const barsEl = document.getElementById('bars');
  const rulerEl = document.getElementById('ruler');
  let noteEls = [[],[],[],[]]; // per row -> per note element

  function render(){
    barsEl.innerHTML=""; noteEls=[[],[],[],[]];
    S.rows.forEach((bar,ri)=>{
      const div=document.createElement('div');
      div.className='bar'+(ri===3?' variation':'');
      // gridlines per beat
      for(let b=0;b<S.beats;b++){
        const gl=document.createElement('div');
        gl.className='grid-line'+(b===0?' down':'');
        gl.style.left=(b/S.beats*100)+'%';
        div.appendChild(gl);
      }
      // notes
      bar.forEach((n,ni)=>{
        const cell=document.createElement('div');
        cell.className='note'; if(n.rest) cell.dataset.rest='1';
        cell.style.position='absolute';
        cell.style.left=(n.t/S.beats*100)+'%';
        cell.style.width=(n.d/S.beats*100)+'%';
        cell.style.top='0'; cell.style.bottom='0';
        cell.innerHTML=`<svg viewBox="0 0 40 60" preserveAspectRatio="xMidYMid meet" style="max-width:40px"><g class="nh">${glyph(n.d,n.rest,ri===3)}</g></svg>`;
        div.appendChild(cell);
        noteEls[ri][ni]=cell;
      });
      const ph=document.createElement('div'); ph.className='playhead'; ph.dataset.ph='1';
      div.appendChild(ph);
      barsEl.appendChild(div);
    });
    rulerEl.innerHTML="";
    for(let b=0;b<S.beats;b++){ const s=document.createElement('span'); s.textContent=(b+1); rulerEl.appendChild(s); }
  }

  // ---------- audio ----------
  let ctx=null;
  function ac(){ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); return ctx; }
  function click(time, accent){
    const c=ac();
    const o=c.createOscillator(), g=c.createGain();
    o.frequency.value=accent?1500:900;
    g.gain.setValueAtTime(0.0001,time);
    g.gain.exponentialRampToValueAtTime(accent?0.5:0.32,time+0.001);
    g.gain.exponentialRampToValueAtTime(0.0001,time+0.05);
    o.connect(g).connect(c.destination); o.start(time); o.stop(time+0.06);
  }
  function pluck(time){
    const c=ac();
    const o=c.createOscillator(), g=c.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(220,time);
    o.frequency.exponentialRampToValueAtTime(180,time+0.12);
    g.gain.setValueAtTime(0.0001,time);
    g.gain.exponentialRampToValueAtTime(0.42,time+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,time+0.18);
    o.connect(g).connect(c.destination); o.start(time); o.stop(time+0.2);
  }

  // ---------- scheduler ----------
  let nextBeatTime=0, phase='play', pointer={row:0,beat:0};
  let barQueue=[];   // {row, start, dur}
  let hitQueue=[];   // {row, ni, time, done}
  let timerId=null;
  const LOOK=0.1, TICK=25;

  function spb(){ return 60/S.bpm; }              // seconds per pulse
  function startPlay(){
    const c=ac(); if(c.state==='suspended') c.resume();
    S.playing=true; document.getElementById('playIcon').innerHTML='<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>';
    nextBeatTime=c.currentTime+0.1;
    pointer={row:0,beat:0}; barQueue=[]; hitQueue=[];
    phase = S.countIn ? 'count' : 'play';
    S.countLeft = S.beats;
    timerId=setInterval(scheduler,TICK);
    requestAnimationFrame(raf);
  }
  function stopPlay(){
    S.playing=false; clearInterval(timerId); timerId=null;
    document.getElementById('playIcon').innerHTML='<path d="M7 5l12 7-12 7z"/>';
    document.querySelectorAll('.bar').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.note.hit').forEach(n=>n.classList.remove('hit'));
    setBeacon(false,false);
  }
  function scheduler(){
    const c=ac();
    while(nextBeatTime < c.currentTime + LOOK){
      if(phase==='count'){
        if(S.met) click(nextBeatTime, (S.countLeft===S.beats));
        S.countLeft--;
        nextBeatTime += spb();
        if(S.countLeft<=0){ phase='play'; pointer={row:0,beat:0}; }
        continue;
      }
      const {row,beat}=pointer;
      // metronome each pulse
      if(S.met) click(nextBeatTime, beat===0);
      // at downbeat: schedule this bar's note onsets + queue bar for playhead
      if(beat===0){
        const start=nextBeatTime;
        barQueue.push({row, start, dur:S.beats*spb()});
        S.rows[row].forEach((n,ni)=>{
          if(n.rest) return;
          const t=start + n.t*spb();
          if(S.notes) pluck(t);
          hitQueue.push({row, ni, time:t, done:false});
        });
      }
      // advance
      nextBeatTime += spb();
      pointer.beat++;
      if(pointer.beat>=S.beats){ pointer.beat=0; pointer.row=(pointer.row+1)%4; }
    }
  }

  const beacon=document.getElementById('beacon');
  function setBeacon(on,acc){ beacon.classList.toggle('on',on); beacon.classList.toggle('acc',on&&acc); }

  function raf(){
    if(!S.playing) return;
    const now=ac().currentTime;
    // prune old bars
    barQueue=barQueue.filter(b=>now < b.start+b.dur+0.05);
    // active bar (visual)
    let active=null;
    for(const b of barQueue){ if(now>=b.start && now<b.start+b.dur){ active=b; break; } }
    const barEls=document.querySelectorAll('.bar');
    barEls.forEach((el,i)=>{
      const on = active && i===active.row;
      el.classList.toggle('active',!!on);
      const ph=el.querySelector('[data-ph]');
      if(on){ ph.style.left=((now-active.start)/active.dur*100)+'%'; }
    });
    // beacon pulse on pulse boundaries of active bar
    if(active){
      const frac=(now-active.start)/spb();
      const inBeat=frac-Math.floor(frac);
      const bi=Math.floor(frac);
      setBeacon(inBeat<0.12, bi===0);
    }
    // note hits
    for(const h of hitQueue){
      if(!h.done && now>=h.time){
        h.done=true;
        const el=noteEls[h.row] && noteEls[h.row][h.ni];
        if(el){ el.classList.add('hit'); setTimeout(()=>el.classList.remove('hit'),120); }
        if(S.hap && navigator.vibrate) navigator.vibrate(18);
      }
    }
    hitQueue=hitQueue.filter(h=>!h.done || now < h.time+0.3);
    requestAnimationFrame(raf);
  }

  // ---------- UI wiring ----------
  const $=id=>document.getElementById(id);
  function setBpm(v){
    S.bpm=Math.max(40,Math.min(220,Math.round(v)));
    $('bpm').value=S.bpm; $('bpmNum').textContent=S.bpm; $('bpmLabel').textContent=S.bpm;
  }
  $('bpm').addEventListener('input',e=>setBpm(+e.target.value));

  $('playBtn').addEventListener('click',()=> S.playing?stopPlay():startPlay());

  $('sigChips').addEventListener('click',e=>{
    const b=e.target.closest('.chip'); if(!b) return;
    document.querySelectorAll('#sigChips .chip').forEach(c=>c.classList.remove('sel'));
    b.classList.add('sel'); S.sig=b.dataset.sig;
    S.beats = S.sig==='3/4'?3 : S.sig==='6/8'?6 : 4;
    $('sig').textContent=S.sig;
    if(S.playing) stopPlay();
    regen();
  });
  $('cxChips').addEventListener('click',e=>{
    const b=e.target.closest('.chip'); if(!b) return;
    document.querySelectorAll('#cxChips .chip').forEach(c=>c.classList.remove('sel'));
    b.classList.add('sel'); S.complexity=+b.dataset.cx; regen();
  });

  function toggle(id,key){
    $(id).addEventListener('click',()=>{ S[key]=!S[key]; $(id).classList.toggle('on',S[key]);
      if(key==='hap'&&S[key]&&navigator.vibrate) navigator.vibrate(18); });
  }
  toggle('tgMet','met'); toggle('tgNotes','notes'); toggle('tgHap','hap'); toggle('tgCount','countIn');

  $('genBtn').addEventListener('click',regen);

  // tap tempo
  let taps=[];
  $('tapBtn').addEventListener('click',()=>{
    const t=performance.now(); taps.push(t); taps=taps.filter(x=>t-x<2500);
    if(taps.length>=2){
      let d=0; for(let i=1;i<taps.length;i++) d+=taps[i]-taps[i-1];
      d/=(taps.length-1); setBpm(60000/d);
    }
  });

  // init
  setBpm(90); regen();
})();
</script>
</body>
